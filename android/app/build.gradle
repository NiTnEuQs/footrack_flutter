plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // START: FlutterFire Configuration
    id "com.google.gms.google-services"
    // END: FlutterFire Configuration
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.krynit.footrack"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.krynit.footrack"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // TODO For appcenter
//    signingConfigs {
//        release {
//            storeFile rootProject.file("app/android.keystore")
//            storePassword System.getenv("APPCENTER_KEYSTORE_PASSWORD")
//            keyAlias System.getenv("APPCENTER_KEY_ALIAS")
//            keyPassword System.getenv("APPCENTER_KEY_PASSWORD")
//        }
//    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // TODO For appcenter
//            signingConfig signingConfigs.release
        }
    }

    // TODO For appcenter
//    flavorDimensions "distribute"
//    productFlavors {
//        appCenter {
//            dimension "distribute"
//        }
//
//        googlePlay {
//            dimension "distribute"
//        }
//    }

    lintOptions {
        disable 'InvalidPackage'
//        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

